name: MCP lab checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Cloudflare runtime types
        run: npm run cf-typegen
      - name: Type-check
        run: npm run typecheck
      - name: Dry-run Worker bundle
        run: npm run build
